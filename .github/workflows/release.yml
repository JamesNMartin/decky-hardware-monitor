name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Enable pnpm
        run: corepack enable

      - name: Build plugin zip
        run: ./build.sh

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          body: Automated build from commit ${{ github.sha }}.
          files: decky-hardware-monitor.zip
